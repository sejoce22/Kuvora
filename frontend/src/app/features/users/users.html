<section class="team">
  <p class="eyebrow">Equipo</p>
  <h1>Usuarios</h1>

  @if (loading()) {
    <p class="state" role="status">Cargando equipo…</p>
  } @else if (failed()) {
    <div class="state state--error" role="alert">
      <p>No pudimos cargar los usuarios.</p>
      <button type="button" class="retry" (click)="load()">Reintentar</button>
    </div>
  } @else {
    <div class="sheet">
      <table>
        <caption class="sr-only">
          Usuarios del restaurante
        </caption>
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Email</th>
            <th scope="col">Rol</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users(); track user.id) {
            <tr>
              <td>{{ user.fullName }}</td>
              <td>{{ user.email }}</td>
              <td>{{ roleLabels[user.role] }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
